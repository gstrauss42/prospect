[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/deepseek",
    "crates/engine",
    "crates/imagery",
    "crates/mailer",
    "crates/vault",
    "crates/bedrock",
    "crates/connectors",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# One place for every third-party dependency, so the whole app stays small.
# Add a new one only when the standard library genuinely can't do the job.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
tiny_http = "0.12"
rusqlite = { version = "0.43", features = ["bundled"] }
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
base64 = "0.23"
hmac = "0.13"
chacha20poly1305 = "0.11"

model = { path = "crates/model" }
deepseek = { path = "crates/deepseek" }
engine = { path = "crates/engine" }
imagery = { path = "crates/imagery" }
mailer = { path = "crates/mailer" }
vault = { path = "crates/vault" }
bedrock = { path = "crates/bedrock" }
connectors = { path = "crates/connectors" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# unwind (not abort): a panic in one request or job must never take the server down.
panic = "unwind"
